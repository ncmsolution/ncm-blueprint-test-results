<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NCM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f6f8fb;
    }

    h1 {
      font-size: 36px;
      color: #243447;
    }

    label {
      font-weight: bold;
      margin-right: 10px;
    }

    select {
      padding: 8px;
      font-size: 14px;
      min-width: 220px;
    }

    .section {
      margin-top: 30px;
      display: none;
    }

    .blueprint-buttons,
    .button-container {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #2d72d9;
      color: white;
    }

    button.selected {
      background-color: #28a745;
    }

    .iteration-container {
      display: none;
      margin-top: 20px; /* spacing between DSL and iteration */
    }

    h2 a {
      text-decoration: none;
      color: #2d72d9;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>NCM</h1>

  <!-- NCM Version -->
  <div>
    <label>NCM Versions:</label>
    <select id="versionSelect">
      <option value="">-- Select NCM Version --</option>
      <option value="2.0.0">2.0.0</option>
      <option value="2.1.0">2.1.0</option>
      <option value="2.2.0">2.2.0</option>
    </select>
  </div>

  <!-- Blueprint Section -->
  <div id="blueprintSection" class="section">
    <h2>
      <a href="https://github.com/ncmsolution/ncm-blueprint" target="_blank">
        Blueprints
      </a>
    </h2>

    <div class="blueprint-buttons">
      <button data-blueprint="Foundation-Lite">Foundation‑Lite</button>
      <button data-blueprint="Intermediate-Pro">Intermediate‑Pro</button>
      <button data-blueprint="Comprehensive-Enterprise">
        Comprehensive‑Enterprise
      </button>
    </div>
  </div>

  <!-- DSL / UI -->
  <div id="actionButtons" class="section button-container">
    <button id="dslBtn">DSL</button>
    <button id="uiBtn">UI</button>
  </div>

  <!-- DSL Iteration -->
  <div id="dslIteration" class="iteration-container">
    <label>DSL Iteration:</label>
    <select id="dslIter">
      <option value="">-- Select Iteration --</option>
      <script>
        for (let i = 1; i <= 10; i++) {
          document.write(`<option value="${i}">${i}</option>`);
        }
      </script>
    </select>
  </div>

  <!-- DSL Actions -->
  <div id="dslActions" class="button-container" style="display:none;">
    <button id="launchBtn">Launch</button>
    <button id="deleteBtn">Delete</button>
    <button id="statsBtn">Stats</button>
  </div>

  <!-- UI Iteration -->
  <div id="uiIteration" class="iteration-container">
    <label>UI Iteration:</label>
    <select>
      <option value="">-- Select Iteration --</option>
      <script>
        for (let i = 1; i <= 10; i++) {
          document.write(`<option value="${i}">${i}</option>`);
        }
      </script>
    </select>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const versionSelect = document.getElementById("versionSelect");
      const blueprintSection = document.getElementById("blueprintSection");
      const actionButtons = document.getElementById("actionButtons");
      const dslBtn = document.getElementById("dslBtn");
      const uiBtn = document.getElementById("uiBtn");
      const dslIteration = document.getElementById("dslIteration");
      const uiIteration = document.getElementById("uiIteration");
      const dslActions = document.getElementById("dslActions");
      const blueprintButtons =
        document.querySelectorAll(".blueprint-buttons button");
      const dslIter = document.getElementById("dslIter");

      const SHEET_ID =
        "1b2twKC7Cr62uIMP0loYAkVunS-97Uu0UGA4vz6tVYVI";

      const iterationToGidMap = {
        1: "0",
        2: "149207734",
        3: "269643439",
        4: "577460575"
      };

      /* ✅ Apps Script Web App (Stats – Iteration 1) */
      const STATS_WEB_APP_URL =
        "https://script.google.com/a/macros/nutanix.com/s/AKfycbweEeCw2J3WeBHnlPk_4E0p8vUnSUdA0Dkeu754CqpROBtY4cI9YRfUIIaEj4aDDeqV/exec";

      let selectedBlueprint = "";
      let selectedMode = "";

      /* Initial state */
      blueprintSection.style.display = "none";
      actionButtons.style.display = "none";
      dslIteration.style.display = "none";
      uiIteration.style.display = "none";
      dslActions.style.display = "none";

      /* Version select */
      versionSelect.addEventListener("change", () => {
        blueprintSection.style.display =
          versionSelect.value ? "block" : "none";

        actionButtons.style.display = "none";
        dslIteration.style.display = "none";
        uiIteration.style.display = "none";
        dslActions.style.display = "none";

        blueprintButtons.forEach(b => b.classList.remove("selected"));
        dslBtn.classList.remove("selected");
        uiBtn.classList.remove("selected");
        dslIter.value = "";
      });

      /* Blueprint click */
      blueprintButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          selectedBlueprint = btn.dataset.blueprint;
          blueprintButtons.forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          actionButtons.style.display = "flex";
        });
      });

      /* DSL click */
      dslBtn.addEventListener("click", () => {
        selectedMode = "DSL";
        dslBtn.classList.add("selected");
        uiBtn.classList.remove("selected");
        dslIteration.style.display = "block";
        uiIteration.style.display = "none";
        dslActions.style.display = "flex";
      });

      /* UI click */
      uiBtn.addEventListener("click", () => {
        selectedMode = "UI";
        uiBtn.classList.add("selected");
        dslBtn.classList.remove("selected");
        uiIteration.style.display = "block";
        dslIteration.style.display = "none";
        dslActions.style.display = "none";
      });

      /* Launch → Google Sheet */
      document.getElementById("launchBtn").addEventListener("click", () => {
        const iteration = dslIter.value;
        if (!iteration) {
          alert("Please select a DSL iteration.");
          return;
        }

        if (
          versionSelect.value === "2.0.0" &&
          selectedBlueprint === "Comprehensive-Enterprise" &&
          selectedMode === "DSL" &&
          iterationToGidMap[iteration]
        ) {
          const url =
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${iterationToGidMap[iteration]}`;
          window.open(url, "_blank");
        }
      });

      /* ✅ Stats → Apps Script Web App (Iteration 1 only) */
      document.getElementById("statsBtn").addEventListener("click", () => {
        if (dslIter.value === "1") {
          window.open(STATS_WEB_APP_URL, "_blank");
        } else {
          alert("Stats is available only for DSL Iteration 1.");
        }
      });

      document.getElementById("deleteBtn").onclick = () =>
        alert("Delete action not implemented");
    });
  </script>
</body>
</html>
