<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NCM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f6f8fb;
    }

    h1 {
      font-size: 36px;
      color: #243447;
    }

    label {
      font-weight: bold;
      margin-right: 10px;
    }

    select {
      padding: 8px;
      font-size: 14px;
      min-width: 240px;
    }

    .section {
      margin-top: 30px;
      display: none;
    }

    .blueprint-buttons {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #2d72d9;
      color: white;
    }

    button.selected {
      background-color: #28a745;
    }

    .iteration-container {
      display: none;
      margin-top: 20px;
    }

    h2 a {
      text-decoration: none;
      color: #2d72d9;
      font-weight: bold;
    }

    #csvResultSection {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
<h1>NCM</h1>

<!-- NCM Version -->
<div>
  <label>NCM Versions:</label>
  <select id="versionSelect">
    <option value="">-- Select NCM Version --</option>
    <option value="2.0.0">2.0.0</option>
    <option value="2.1.0">2.1.0</option>
    <option value="2.2.0">2.2.0</option>
  </select>
</div>

<!-- Blueprint Section -->
<div id="blueprintSection" class="section">
  <h2>
    <a href="https://github.com/ncmsolution/ncm-blueprint" target="_blank">
      Blueprints
    </a>
  </h2>
  <div class="blueprint-buttons">
    <button data-blueprint="Foundation-Lite">Foundation‑Lite</button>
    <button data-blueprint="Intermediate-Pro">Intermediate‑Pro</button>
    <button data-blueprint="Comprehensive-Enterprise">
      Comprehensive‑Enterprise
    </button>
  </div>
</div>

<!-- Automation -->
<div id="automationSection" class="section">
  <label>Automation Type:</label>
  <select id="automationType">
    <option value="">-- Select Automation Type --</option>
    <option value="DSL">DSL</option>
    <option value="UI">UI</option>
  </select>
</div>

<!-- DSL Iteration -->
<div id="dslIteration" class="iteration-container">
  <label>DSL Iteration:</label>
  <select id="dslIter">
    <option value="">-- Select Iteration --</option>
    <script>
      for (let i = 1; i <= 10; i++) {
        document.write(`<option value="${i}">${i}</option>`);
      }
    </script>
  </select>
</div>

<!-- Result -->
<div id="resultSection" class="iteration-container">
  <label>Result:</label>
  <select id="resultType">
    <option value="">-- Select Result --</option>
    <option value="Launch">Launch</option>
    <option value="Delete">Delete</option>
    <option value="Stats">Stats</option>
  </select>
</div>

<!-- Hidden CSV Input -->
<input
  type="file"
  id="csvFileInput"
  accept=".csv"
  style="display:none"
/>

<!-- CSV Result Summary -->
<div id="csvResultSection" class="section">
  <h2>Provisioning Result Summary</h2>

  <p style="color:green; font-size:18px;">
    ✅ Success (RUNNING):
    <strong><span id="successCount">0</span></strong>
  </p>

  <p style="color:red; font-size:18px;">
    ❌ Fail / Error:
    <strong><span id="errorCount">0</span></strong>
  </p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const versionSelect = document.getElementById("versionSelect");
  const blueprintSection = document.getElementById("blueprintSection");
  const automationSection = document.getElementById("automationSection");
  const automationType = document.getElementById("automationType");
  const dslIteration = document.getElementById("dslIteration");
  const resultSection = document.getElementById("resultSection");
  const resultType = document.getElementById("resultType");
  const dslIter = document.getElementById("dslIter");

  const blueprintButtons = document.querySelectorAll(".blueprint-buttons button");

  const SHEET_ID = "1b2twKC7Cr62uIMP0loYAkVunS-97Uu0UGA4vz6tVYVI";

  const iterationToGidMap = {
    1: "0",
    2: "149207734",
    3: "269643439",
    4: "577460575"
  };

  versionSelect.addEventListener("change", () => {
    blueprintSection.style.display = versionSelect.value ? "block" : "none";
    automationSection.style.display = "none";
    dslIteration.style.display = "none";
    resultSection.style.display = "none";
  });

  blueprintButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      blueprintButtons.forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      automationSection.style.display = "block";
    });
  });

  automationType.addEventListener("change", () => {
    dslIteration.style.display = automationType.value === "DSL" ? "block" : "none";
    resultSection.style.display = automationType.value ? "block" : "none";
  });

  resultType.addEventListener("change", () => {
    const iteration = dslIter.value;

    if (resultType.value === "Launch") {
      if (!iteration) return alert("Select DSL iteration");
      const gid = iterationToGidMap[iteration];
      if (gid)
        window.open(
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?gid=${gid}`,
          "_blank"
        );

      // ✅ Trigger CSV selection
      document.getElementById("csvFileInput").click();
    }
  });
});

// CSV Parsing Logic
document.getElementById("csvFileInput").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (event) {
    const csvText = event.target.result;
    parseCSV(csvText);
  };
  reader.readAsText(file);
});

function parseCSV(csvText) {
  const lines = csvText.trim().split("\n");
  const headers = lines[0].split(",");

  const stateIndex = headers.findIndex(h =>
    h.trim().toLowerCase() === "state"
  );

  let success = 0;
  let error = 0;

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i]) continue;
    const cols = lines[i].split(",");
    const state = cols[stateIndex]?.trim().toLowerCase();

    if (state === "running") success++;
    else if (state === "error" || state === "failed" || state === "fail")
      error++;
  }

  document.getElementById("successCount").textContent = success;
  document.getElementById("errorCount").textContent = error;
  document.getElementById("csvResultSection").style.display = "block";
}
</script>

</body>
</html>
