<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NCM Dashboard</title>

<style>

body {
  font-family: "Segoe UI", Arial;
  margin: 0;
  background:#f4f6fb;
}

/* ✅ HEADER */

.header {
  background: linear-gradient(90deg, #5b2be0, #7c4dff);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: center;   /* ✅ center horizontally */
  align-items: center;
}

.header h1 {
  margin: 0;
  font-size: 26px;
  text-align: center;
}


/* ✅ CONTAINER */
.container {
  padding: 30px 40px;
}

/* ✅ CARD */
.card {
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  margin-bottom:20px;
}

/* ✅ INPUTS */
select {
  padding:10px;
  min-width:260px;
  border-radius:6px;
  border:1px solid #ccc;
  margin-top:10px;
}

/* ✅ TABLE */
table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th {
  background:#5b2be0;
  color:white;
  padding:12px;
}

td {
  padding:12px;
  border:1px solid #ddd;
  text-align:center;
}

/* ✅ STATUS COLORS */
.success { color:green; font-weight:bold; }
.error { color:red; font-weight:bold; }

/* ✅ HIDE */
.hidden { display:none; }

</style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">
<!--  <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Nutanix_logo.svg">-->
  <h1>NCM Dashboard</h1>
</div>

<div class="container">

<!-- VERSION -->
<div class="card">
  <label><b>NCM Version</b></label><br>
  <select id="versionSelect">
    <option value="">-- Select --</option>
    <option>2.0.0</option>
    <option>2.1.0</option>
    <option>2.2.0</option>
  </select>
</div>

<!-- BLUEPRINT -->
<div id="blueprintSection" class="card hidden">
  <label><b>Blueprint</b></label><br>
  <select id="blueprintSelect">
    <option value="">-- Select --</option>
    <option>Foundation‑Lite</option>
    <option>Intermediate‑Pro</option>
    <option>Comprehensive‑Enterprise</option>
  </select>
</div>

<!-- AUTOMATION -->
<div id="automationSection" class="card hidden">
  <label><b>Automation Type</b></label><br>
  <select id="automationType">
    <option value="">-- Select --</option>
    <option value="DSL">DSL</option>
    <option value="UI">UI</option>
  </select>
</div>

<!-- DSL -->
<div id="dslIteration" class="card hidden">
  <label><b>DSL</b></label><br>
  <select id="dslIter">
    <option value="">-- Select Iteration --</option>
  </select>
</div>

<!-- RESULT -->
<div id="resultSection" class="card hidden">
  <label><b>Result</b></label><br>
  <select id="resultType">
    <option value="">-- Select --</option>
    <option value="Launch">Launch</option>
    <option value="Stats">Stats</option>
    <option value="Delete">Delete</option>
  </select>
</div>

<input type="file" id="fileInput" style="display:none">

<!-- SUMMARY -->
<div id="summaryCard" class="card hidden">

  <h2>Provisioning Summary</h2>

  <table>
    <tr><th>Status</th><th>Count</th><th>%</th></tr>

    <tr>
      <td class="success">SUCCESS</td>
      <td id="successCount">0</td>
      <td id="successPercent">0%</td>
    </tr>

    <tr>
      <td class="error">ERROR</td>
      <td id="errorCount">0</td>
      <td id="errorPercent">0%</td>
    </tr>

    <tr>
      <td><b>Total</b></td>
      <td id="totalCount">0</td>
      <td>100%</td>
    </tr>
  </table>

  <table id="resultTable">
    <thead id="errorTableHead"></thead>
    <tbody id="errorTableBody"></tbody>
  </table>

</div>

</div>

<script>

// DSL
let iter=document.getElementById("dslIter");
for(let i=1;i<=10;i++){
  let o=document.createElement("option");
  o.text=i; iter.add(o);
}

// ELEMENTS
let version=document.getElementById("versionSelect");
let blueprint=document.getElementById("blueprintSection");
let bpSelect=document.getElementById("blueprintSelect");
let automation=document.getElementById("automationSection");
let autoType=document.getElementById("automationType");
let dsl=document.getElementById("dslIteration");
let result=document.getElementById("resultSection");
let resultType=document.getElementById("resultType");
let summary=document.getElementById("summaryCard");

// FLOW
version.onchange=()=> blueprint.classList.remove("hidden");
bpSelect.onchange=()=> automation.classList.remove("hidden");

autoType.onchange=()=>{
  if(autoType.value==="DSL") dsl.classList.remove("hidden");
  result.classList.remove("hidden");
};

resultType.onchange=()=>{
  let input=document.getElementById("fileInput");

  if(resultType.value==="Launch"){
    input.accept=".csv"; input.click();
  }
  if(resultType.value==="Delete"){
    input.accept=".log"; input.click();
  }
  if(resultType.value==="Stats"){
    input.accept=".html"; input.click();
  }
};

// FILE
document.getElementById("fileInput").onchange=(e)=>{
  let file=e.target.files[0];
  if(!file) return;

  let type=resultType.value;

  if(type==="Stats"){
    let r=new FileReader();
    r.onload=(ev)=>{
      let html=ev.target.result;
      let w=window.open();
      w.document.write(html);
      w.document.close();
      parseHTMLStats(html);
    };
    r.readAsText(file);
  }
  else{
    file.text().then(t=>{
      if(type==="Delete") parseDeleteLog(t);
      else parseCSV(t);
    });
  }
};

// CSV
function parseCSV(text){
  document.getElementById("resultTable").style.display="table";

  let lines=text.split("\n");
  let headers=lines[0].split(",");
  let lower=headers.map(h=>h.toLowerCase());

  let nameIdx=lower.indexOf("app name");
  let stateIdx=lower.findIndex(h=>h.includes("state"));
  let uuidIdx=lower.findIndex(h=>h.includes("uuid"));

  let success=0,error=0,rows=[];

  for(let i=1;i<lines.length;i++){
    let c=lines[i].split(",");
    let s=c[stateIdx]?.toLowerCase();

    if(s==="running") success++;
    else if(["error","failed"].includes(s)){
      error++; rows.push(c);
    }
  }

  updateSummary(success,error);

  let head=document.getElementById("errorTableHead");
  let body=document.getElementById("errorTableBody");

  head.innerHTML="<tr><th>App Name</th><th>State</th><th>UUID</th></tr>";
  body.innerHTML="";

  rows.forEach(r=>{
    body.innerHTML+=`<tr>
      <td>${r[nameIdx]}</td>
      <td class="error">${r[stateIdx]}</td>
      <td>${r[uuidIdx]}</td>
    </tr>`;
  });

  summary.classList.remove("hidden");
}

// DELETE
function parseDeleteLog(text){

  let success=0,error=0;

  text.split("\n").forEach(l=>{
    l=l.toLowerCase();
    if(l.includes("deleted successfully")) success++;
  });

  updateSummary(success,error);

  document.getElementById("resultTable").style.display="none";
  summary.classList.remove("hidden");
}

// HTML STATS
function parseHTMLStats(html){

  let doc=new DOMParser().parseFromString(html,"text/html");
  let success=0,error=0;

  doc.querySelectorAll("td").forEach(td=>{
    let t=td.textContent.toLowerCase().trim();
    if(t==="running") success++;
    else if(["error","failed"].includes(t)) error++;
  });

  updateSummary(success,error);

  document.getElementById("resultTable").style.display="none";
  summary.classList.remove("hidden");
}

// SUMMARY
function updateSummary(s,e){
  let total=s+e;

  document.getElementById("successCount").textContent=s;
  document.getElementById("errorCount").textContent=e;
  document.getElementById("totalCount").textContent=total;

  document.getElementById("successPercent").textContent =
    total?((s/total)*100).toFixed(2)+"%":"0%";

  document.getElementById("errorPercent").textContent =
    total?((e/total)*100).toFixed(2)+"%":"0%";
}

</script>

</body>
</html>
